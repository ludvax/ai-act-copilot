# Corpus manifest. Raw files are NOT versioned: `aiact ingest --download` fetches them
# into data/raw/ and records checksums, so an index can always be rebuilt from this file.
#
# Legal texts come from the EU Publications Office (Cellar) by content negotiation on the
# CELEX id, rather than by scraping the EUR-Lex web pages.
